<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep-Live-Cam — output</title>
<style>
  /* Deliberately bare: this page is a video surface. In OBS the black
     background is what you want behind a letterboxed frame, and any chrome
     here would end up composited into the scene. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  #err {
    position: fixed; left: 0; right: 0; bottom: 0;
    font: 12px ui-monospace, monospace; color: #f85149;
    background: rgba(0,0,0,.75); padding: 6px 10px;
    display: none;
  }
  /* ?bare=1 hides even the error strip, for a guaranteed-clean OBS capture. */
  body.bare #err { display: none !important; }
</style>
</head>
<body>
<img id="out" alt="">
<div id="err"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const session = params.get("s") || "";
if (params.get("bare") === "1") document.body.classList.add("bare");

const img = document.getElementById("out");
const err = document.getElementById("err");

function streamUrl() {
  const q = new URLSearchParams();
  if (token) q.set("token", token);
  if (session) q.set("s", session);
  // Cache-buster: without it a reconnect can be served the dead connection.
  q.set("_", Date.now().toString());
  return "/stream.mjpg?" + q.toString();
}

let retry = 0;
function connect() {
  img.src = streamUrl();
}

// An MJPEG <img> surfaces a dropped stream as an error. Reconnect with backoff
// so the source recovers on its own if the server restarts.
img.addEventListener("error", () => {
  retry = Math.min(retry + 1, 6);
  const wait = Math.min(500 * 2 ** retry, 15000);
  err.style.display = "block";
  err.textContent = `stream dropped — reconnecting in ${(wait / 1000).toFixed(1)}s`;
  setTimeout(connect, wait);
});

img.addEventListener("load", () => {
  retry = 0;
  err.style.display = "none";
});

connect();
</script>
</body>
</html>
