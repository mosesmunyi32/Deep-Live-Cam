<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep-Live-Cam — live</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c;
    --fg: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --bad: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px; margin-bottom: 16px;
  }
  button, input, select {
    background: #0d1117; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font: inherit;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figcaption { padding: 8px 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  video, img#out { width: 100%; display: block; background: #000; aspect-ratio: 4/3; object-fit: contain; }
  #status { margin-top: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status.err { color: var(--bad); }
  #status.ok { color: var(--ok); }
  label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .mono { font-family: ui-monospace, monospace; color: var(--fg); }
  .hint { color: var(--muted); font-size: 12px; flex: 1 1 260px; }
  .hint b { color: var(--fg); }
  input[type=range] { accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
</style>
</head>
<body>

<h1>Deep-Live-Cam — live stream</h1>
<div class="sub">Frames are sent to the GPU pod over a WebSocket and returned swapped.</div>

<div class="controls">
  <label>Source face <input type="file" id="srcFile" accept="image/*"></label>
  <label>Camera
    <select id="camera"><option value="">default</option></select>
  </label>
  <button id="refreshCams" title="Re-scan for cameras">⟳</button>
  <label>FPS cap
    <select id="fps">
      <option value="10">10</option>
      <option value="15" selected>15</option>
      <option value="20">20</option>
      <option value="30">30</option>
    </select>
  </label>
  <label>Width
    <select id="width">
      <option value="480">480</option>
      <option value="640" selected>640</option>
      <option value="960">960</option>
    </select>
  </label>
  <button id="start" class="primary">Start</button>
  <button id="stop" disabled>Stop</button>
</div>

<div class="controls">
  <label>Model
    <select id="model"><option value="fp32">loading…</option></select>
  </label>
  <label>Opacity
    <input type="range" id="opacity" min="0" max="1" step="0.05" value="1">
    <span id="opacityVal" class="mono">1.00</span>
  </label>
  <label><input type="checkbox" id="manyFaces"> All faces</label>
  <label><input type="checkbox" id="mouthMask"> Mouth mask</label>
  <label><input type="checkbox" id="colorCorrection" checked> Colour correct</label>
</div>

<div class="controls">
  <button id="popout">Open output window</button>
  <button id="copyObs">Copy OBS browser-source URL</button>
  <span id="obsHint" class="hint">OBS → Sources → + → <b>Browser</b> → paste URL, 960×540, uncheck "Shutdown source when not visible".</span>
</div>

<div class="stage">
  <figure><figcaption>Camera</figcaption><video id="cam" autoplay playsinline muted></video></figure>
  <figure><figcaption>Swapped</figcaption><img id="out" alt="swapped output"></figure>
</div>

<div id="status">Idle.</div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const token = new URLSearchParams(location.search).get("token") || "";

let ws = null, stream = null, running = false;
let inFlight = false, sourceReady = false, sessionId = "";
let frames = 0, lastTick = performance.now(), lastLatency = 0, sentAt = 0;
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: false });

function setStatus(msg, cls = "") {
  statusEl.textContent = msg;
  statusEl.className = cls;
}

function wsUrl() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}/ws${token ? "?token=" + encodeURIComponent(token) : ""}`;
}

$("srcFile").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const b64 = await new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "source", data: b64 }));
    setStatus("Uploading source face…");
  } else {
    sessionStorage.setItem("pendingSource", b64);
    setStatus("Source staged — press Start.");
  }
});

async function listCameras() {
  const sel = $("camera");
  const previous = sel.value;
  let devices = [];
  try {
    devices = await navigator.mediaDevices.enumerateDevices();
  } catch (err) {
    setStatus("Could not enumerate devices: " + err.message, "err");
    return;
  }
  const cams = devices.filter((d) => d.kind === "videoinput");
  sel.innerHTML = "";

  const def = document.createElement("option");
  def.value = "";
  def.textContent = cams.length ? "default" : "no camera found";
  sel.appendChild(def);

  cams.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    // Labels are empty until getUserMedia has been granted once, so fall back
    // to a positional name rather than showing blank rows.
    o.textContent = d.label || `Camera ${i + 1}`;
    sel.appendChild(o);
  });

  if (previous && cams.some((d) => d.deviceId === previous)) sel.value = previous;
}

async function openCamera() {
  const width = parseInt($("width").value, 10);
  const deviceId = $("camera").value;
  const video = {
    width: { ideal: width },
    height: { ideal: Math.round(width * 3 / 4) },
  };
  if (deviceId) video.deviceId = { exact: deviceId };

  try {
    return await navigator.mediaDevices.getUserMedia({ video, audio: false });
  } catch (err) {
    // exact deviceId fails outright if that camera is busy or gone; a nameless
    // failure is worse than quietly falling back to whatever is available.
    if (deviceId && (err.name === "OverconstrainedError" || err.name === "NotFoundError")) {
      setStatus("That camera is unavailable — using the default instead.", "err");
      delete video.deviceId;
      return await navigator.mediaDevices.getUserMedia({ video, audio: false });
    }
    throw err;
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
}

// Swap the camera without dropping the session: only the local capture changes.
async function switchCamera() {
  if (!running) return;
  stopCamera();
  try {
    stream = await openCamera();
  } catch (err) {
    setStatus("Camera switch failed: " + err.message, "err");
    return;
  }
  $("cam").srcObject = stream;
  inFlight = false;   // a frame from the old device will never be answered
  setStatus("Camera switched.", "ok");
}

$("camera").addEventListener("change", switchCamera);
$("width").addEventListener("change", switchCamera);
$("refreshCams").addEventListener("click", listCameras);

// Fires when a webcam is plugged in or removed.
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener("devicechange", listCameras);
}

listCameras();

$("start").addEventListener("click", async () => {
  try {
    stream = await openCamera();
  } catch (err) {
    setStatus("Camera access denied: " + err.message, "err");
    return;
  }
  // Labels are only exposed once permission has been granted, so re-enumerate
  // now to replace "Camera 1/2" with the real device names.
  listCameras();
  $("cam").srcObject = stream;

  ws = new WebSocket(wsUrl());
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    running = true;
    $("start").disabled = true;
    $("stop").disabled = false;
    setStatus("Connected. Waiting for a source face…", "ok");
    const staged = sessionStorage.getItem("pendingSource");
    if (staged) {
      ws.send(JSON.stringify({ type: "source", data: staged }));
      sessionStorage.removeItem("pendingSource");
    }
    pump();
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const body = JSON.parse(ev.data);
      if (body.type === "error") { setStatus("Error: " + body.message, "err"); return; }
      if (body.type === "hello") {
        sessionId = body.session || "";
        fillModels(body.models, body.settings);
        applySettings(body.settings);
        setStatus(`Connected (session ${sessionId}). Choose a source face…`, "ok");
        return;
      }
      if (body.type === "settings") { applySettings(body.settings); return; }
      if (body.message === "source face set") sourceReady = true;
      setStatus(body.message, "ok");
      return;
    }
    // Binary: a swapped frame.
    lastLatency = performance.now() - sentAt;
    inFlight = false;
    frames++;
    const blob = new Blob([ev.data], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);
    const img = $("out");
    const prev = img.src;
    img.src = url;
    if (prev.startsWith("blob:")) URL.revokeObjectURL(prev);
  };

  ws.onclose = () => { setStatus("Disconnected.", "err"); teardown(); };
  ws.onerror = () => setStatus("WebSocket error — check the token and the pod logs.", "err");
});

$("stop").addEventListener("click", teardown);

function teardown() {
  running = false;
  if (ws && ws.readyState === WebSocket.OPEN) ws.close();
  stopCamera();
  $("start").disabled = false;
  $("stop").disabled = true;
}

function fillModels(models, settings) {
  const sel = $("model");
  sel.innerHTML = "";
  (models || []).forEach((m) => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = `${m.id} — ${m.file} (${m.size_mb} MB)`;
    sel.appendChild(o);
  });
  if (settings) sel.value = settings.precision;
}

function applySettings(st) {
  if (!st) return;
  $("model").value = st.precision;
  $("manyFaces").checked = st.many_faces;
  $("mouthMask").checked = st.mouth_mask;
  $("colorCorrection").checked = st.color_correction;
  $("opacity").value = st.opacity;
  $("opacityVal").textContent = Number(st.opacity).toFixed(2);
}

function sendConfig(patch) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(Object.assign({ type: "config" }, patch)));
  } else {
    setStatus("Connect first — settings apply to the running server.", "err");
  }
}

$("model").addEventListener("change", (e) => {
  setStatus(`Loading ${e.target.value} model…`);
  sendConfig({ precision: e.target.value });
});
$("manyFaces").addEventListener("change", (e) => sendConfig({ many_faces: e.target.checked }));
$("mouthMask").addEventListener("change", (e) => sendConfig({ mouth_mask: e.target.checked }));
$("colorCorrection").addEventListener("change", (e) => sendConfig({ color_correction: e.target.checked }));
$("opacity").addEventListener("input", (e) => {
  $("opacityVal").textContent = Number(e.target.value).toFixed(2);
});
$("opacity").addEventListener("change", (e) => sendConfig({ opacity: parseFloat(e.target.value) }));

function outputUrl(bare) {
  const q = new URLSearchParams();
  if (token) q.set("token", token);
  if (sessionId) q.set("s", sessionId);
  if (bare) q.set("bare", "1");
  return `${location.origin}/output?${q.toString()}`;
}

$("popout").addEventListener("click", () => {
  window.open(outputUrl(false), "dlc-output", "width=980,height=580");
});

$("copyObs").addEventListener("click", async () => {
  const url = outputUrl(true);
  try {
    await navigator.clipboard.writeText(url);
    setStatus("OBS URL copied to clipboard.", "ok");
  } catch {
    // Clipboard needs a secure context and permission; fall back to showing it.
    window.prompt("Copy this into an OBS Browser source:", url);
  }
});

function pump() {
  const video = $("cam");
  const interval = 1000 / parseInt($("fps").value, 10);
  let last = 0;

  function tick(now) {
    if (!running) return;
    requestAnimationFrame(tick);

    // Only one frame in flight at a time. This paces the sender to whatever the
    // GPU can actually keep up with, instead of queueing frames in the socket.
    if (inFlight || !sourceReady) return;
    if (now - last < interval) return;
    if (!video.videoWidth) return;
    last = now;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    canvas.toBlob((blob) => {
      if (!blob || !running || ws.readyState !== WebSocket.OPEN) return;
      blob.arrayBuffer().then((buf) => {
        inFlight = true;
        sentAt = performance.now();
        ws.send(buf);
      });
    }, "image/jpeg", 0.8);
  }
  requestAnimationFrame(tick);

  setInterval(() => {
    if (!running) return;
    const dt = (performance.now() - lastTick) / 1000;
    const fps = (frames / dt).toFixed(1);
    frames = 0; lastTick = performance.now();
    setStatus(`Streaming — ${fps} fps · round-trip ${lastLatency.toFixed(0)} ms`, "ok");
  }, 1000);
}
</script>
</body>
</html>
