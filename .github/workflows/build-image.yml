name: Build and push streaming image

# Builds deploy/Dockerfile and pushes it to GitHub Container Registry, so the
# ~13 GB image never has to travel over a home uplink. Runpod pulls from ghcr
# the same way it pulls from Docker Hub.

on:
  push:
    branches: [main, runpod-deploy]
    paths:
      - 'deploy/**'
      - 'modules/**'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Reclaim disk space
        # The image is ~13 GB and intermediate layers roughly double that. A
        # stock runner has ~25 GB free, which is not enough. Deleting the
        # preinstalled toolchains we do not use buys back ~30 GB.
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Compute image reference
        # ghcr rejects uppercase in a repository path, and this repo is
        # "Deep-Live-Cam". Lowercase it rather than hardcoding the owner.
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}-stream' \
            | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Emit a plain manifest. Attestations wrap the image in an OCI index
          # that some pullers, Runpod included, handle poorly.
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:latest"
            echo "${{ env.IMAGE }}:sha-${GITHUB_SHA}"
            echo '```'
            echo ""
            echo "Package visibility defaults to private. Runpod needs either a"
            echo "public package or registry credentials - see deploy/README.md."
          } >> "$GITHUB_STEP_SUMMARY"
